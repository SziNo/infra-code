apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: 362099375729.dkr.ecr.us-west-2.amazonaws.com/szino/hello:1.0.0
          ports:
            - containerPort: 8080
